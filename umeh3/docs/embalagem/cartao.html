<div class="top"><b>UMEH</b><span>Fone sem tiara<br>Como montar e usar</span></div>
<div class="box"><b>Na caixa:</b> 2 conchas com gancho (L e R), faixa da nuca, cabo 2 pinos 0,78 mm e este cartão.</div>
<h2>1. Encaixe a faixa da nuca</h2>
<ol><li>A curva da faixa fica para baixo, atrás da nuca. Cada ponta tem um pino dobrado.</li>
<li>Ponha o pino no furo da tampa (atrás da concha) e aperte a mangueira de silicone com o polegar para dentro do canal até entrar inteira. Faça nos dois lados.</li></ol>
<h2>2. Ligue o cabo</h2>
<ol><li>Encaixe os conectores de 2 pinos: o L do cabo na concha L, o R na concha R. Empurre reto, sem girar.</li>
<li>Prenda o cabo na faixa perto de cada concha, para o puxão ir para a faixa e não para a orelha.</li></ol>
<h2>3. Vista e ajuste</h2>
<ol><li>Passe cada gancho por cima da orelha; a faixa fica atrás da nuca, sem tocar no cabelo de cima.</li>
<li>A almofada da sela deve apoiar na <b>raiz da orelha</b> (onde ela encontra a cabeça), não no topo dela. Para subir ou descer a concha, deslize o fio do gancho na bucha.</li>
<li>Para centralizar a almofada na orelha, levante o gancho até o pino da trava sair do furo, gire e encaixe em outro dos 9 furos.</li>
<li>Ajuste fino: dobre o fio do gancho com a mão, devagar.</li></ol>
<h2>4. Troque o driver sem solda</h2>
<ol><li>Puxe a almofada e tire a tela da frente.</li>
<li>Gire o anel 30° para soltar (anti-horário no lado direito, horário no esquerdo) e tire o driver e os discos de EVA.</li>
<li>Driver de outro tamanho (40 a 60 mm): corte discos de EVA novos no molde e tire os anéis da placa de quebrar até o tamanho dele. Gire o driver até os dois terminais ficarem em cima das duas tiras, com o + na tira do +, e encaixe.</li>
<li>Teste com música antes de fechar. Se chiar ou ficar mudo, gire o driver 1 ou 2 mm. Traseira de metal: cubra o metal com fita isolante, deixando só os terminais livres.</li></ol>
<h2>Cuidados</h2>
<ul><li>Não deixe no carro ao sol: o plástico deforma acima de 80 °C.</li>
<li>Limpe a almofada com pano úmido; não molhe as conchas.</li>
<li>Não puxe pelo cabo; tire o fone pelos ganchos.</li></ul>
